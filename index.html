<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Unit Converter</title>
  </head>
  <body>
    <main>
      <div class="top-cell">
        <h2>Metric/Imperial Unit Conversion</h2>
        <div>
          <input
            class="input-box"
            type="text"
            id="js-myInput"
            inputmode="numeric"
            size="3"
            maxlength="3"
          />
        </div>
        <button id="js-convert">Convert</button>
      </div>
      <div class="bottom-cell">
        <div class="dimension">
          <h3>Length (Meters/Feet)</h3>
          <div class="data">
            <p>
              <span id="js-starting-meters">0</span> meters =
              <span id="js-ending-feet">0</span> feet
            </p>
            <p>
              <span id="js-starting-feet">0</span> feet =
              <span id="js-ending-meters">0</span> meters
            </p>
          </div>
        </div>
        <div class="dimension">
          <h3>Volume (Liters/Gallons)</h3>
          <div class="data">
            <p>
              <span id="js-starting-liters">0</span> liters =
              <span id="js-ending-gallons">0</span> gallons
            </p>
            <p>
              <span id="js-starting-gallons">0</span> gallons =
              <span id="js-ending-liters">0</span> liters
            </p>
          </div>
        </div>
        <div class="dimension">
          <h3>Mass (Kilograms/Pounds)</h3>
          <div class="data">
            <p>
              <span id="js-starting-kilos">0</span> kilos =
              <span id="js-ending-pounds">0</span> pounds
            </p>
            <p>
              <span id="js-starting-pounds">0</span> pounds =
              <span id="js-ending-kilos">0</span> kilos
            </p>
          </div>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
